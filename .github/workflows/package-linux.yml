name: Package Linux

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    name: AppImage and Debian
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="$RELEASE_VERSION"
          else
            version="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget xauth xvfb \
            extra-cmake-modules libcurl4-gnutls-dev libpcap0.8-dev \
            libsdl2-dev libarchive-dev libzstd-dev libenet-dev libfaad-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libfuse2 \
            qtbase5-dev qtbase5-private-dev qtmultimedia5-dev \
            libqt5svg5-dev libqt5websockets5-dev qtwayland5 dpkg-dev zstd

      - name: Enable matching source packages
        run: |
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            grep '^deb ' /etc/apt/sources.list | sed 's/^deb /deb-src /' | \
              sudo tee /etc/apt/sources.list.d/widemelon-source.list >/dev/null
          fi
          sudo apt-get update

      - name: Build and test
        env:
          WIDEMELON_USE_QT6: "0"
        run: ./scripts/build.sh

      - name: Generate application source input
        run: ./scripts/package-source.sh "$VERSION"

      - name: Build Debian package
        run: |
          deb_version=${VERSION/-dev./~dev.}
          cmake -S . -B build/deb -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_LTO_RELEASE=OFF -DUSE_QT6=OFF \
            -DWIDEMELON_ENABLE_DEB=ON \
            -DWIDEMELON_PACKAGE_VERSION="$deb_version"
          cmake --build build/deb --parallel
          cpack --config build/deb/CPackConfig.cmake -B dist -G DEB
          if [[ "$deb_version" != "$VERSION" ]]; then
            mv "dist/widemelon_${deb_version}-1_amd64.deb" \
              "dist/widemelon_${VERSION}-1_amd64.deb"
          fi
          dpkg-deb --info "dist/widemelon_${VERSION}-1_amd64.deb"

      - name: Test Debian package
        run: |
          sudo apt-get install --yes "./dist/widemelon_${VERSION}-1_amd64.deb"
          xvfb-run -a widemelon --help

      - name: Stage application
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr -DENABLE_LTO_RELEASE=OFF -DUSE_QT6=OFF
          DESTDIR="$GITHUB_WORKSPACE/build/AppDir" cmake --install build

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
          EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
          EXTRA_QT_MODULES: "waylandcompositor"
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          mkdir -p build/appimage-tools
          wget --quiet -P build/appimage-tools \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget --quiet -P build/appimage-tools \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x build/appimage-tools/*.AppImage
          export LDAI_OUTPUT="$GITHUB_WORKSPACE/dist/WideMelon-${VERSION}-x86_64.AppImage"
          build/appimage-tools/linuxdeploy-x86_64.AppImage \
            --appdir build/AppDir --plugin qt --output appimage
          xvfb-run -a "$LDAI_OUTPUT" --appimage-extract-and-run --help

      - name: Archive bundled-library sources
        run: ./scripts/package-third-party-source.sh "$VERSION" build/AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-x86_64-appimage
          path: dist/WideMelon-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-x86_64-debian
          path: dist/widemelon_${{ env.VERSION }}-1_amd64.deb
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux source inputs
        uses: actions/upload-artifact@v7
        with:
          name: WideMelon-${{ env.VERSION }}-linux-x86_64-source
          path: |
            dist/widemelon-${{ env.VERSION }}-source.tar.xz
            dist/widemelon-${{ env.VERSION }}-third-party-source.tar.xz
          if-no-files-found: error
